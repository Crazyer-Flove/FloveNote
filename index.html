<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var currentFetch = origFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Fallback if Object.defineProperty is restricted
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloveNote - 极简 Markdown 时间轴笔记</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
